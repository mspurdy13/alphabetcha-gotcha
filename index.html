<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8bd39"><title>AlphaBetchaGotcha! Multiplayer</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1d2733;background:#fff9eb}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:18px 14px 70px}h1{font-size:clamp(27px,7vw,43px);line-height:1.05;margin:12px 0}h2{margin:12px 0}p{line-height:1.5}.panel{background:white;border:1px solid #e5d6b5;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #442b0b0a}.hero{background:#f8bd39;border-radius:18px;padding:16px}.muted{color:#60636a;font-size:14px}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;background:#f5b627;color:#1d2733;font-weight:800;cursor:pointer;min-height:46px}button.secondary{background:#eae9e6}button:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;border:1px solid #c9c9c9;border-radius:11px;padding:12px;background:#fff;min-width:0}label{display:block;font-weight:650;margin:10px 0}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.field{display:flex;gap:10px;align-items:center;margin:7px 0}.field b{width:26px;text-align:center;font-size:19px}.field input{flex:1}.notice{padding:12px;background:#fff0c3;border-radius:12px;font-weight:700}.hide{display:none!important}.score{flex:1;border-radius:12px;background:#fff6de;padding:12px}.small{font-size:13px}.mic{background:#d8f1ea}.recording{background:#ed7777}.status{font-size:13px;min-height:18px;color:#77501a}#app{min-height:50vh}a{color:#135b92}#history{font-size:13px;color:#555} .caps{letter-spacing:.1em;font-size:12px;font-weight:800} .full{width:100%}
</style></head><body><main><header><div class="caps">TWO-PLAYER MEMORY CHALLENGE</div><h1>ALPHABETCHA<br>GOTCHA! 🎯</h1><div id="connection" class="status">Connecting…</div></header><div id="app"></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(), app=document.getElementById('app'),ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ',qs=new URLSearchParams(location.search),codeFromLink=(qs.get('room')||'').toUpperCase();let state=null,identity=null,lastTurn='',voice=null,voiceTarget='recall';const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const el=id=>document.getElementById(id);const input=(id,placeholder='')=>`<input id="${id}" autocomplete="off" placeholder="${placeholder}">`;const btn=(text,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${text}</button>`;
function save(){if(identity)localStorage.setItem('abg-'+identity.code,JSON.stringify(identity))}function remember(code){try{return JSON.parse(localStorage.getItem('abg-'+code))}catch{return null}}
function entry(){app.innerHTML=`<div class="panel"><h2>Play together, anywhere</h2><p class="muted">Create a private room, then send your friend the link. Each person plays on their own phone.</p><label>Your name ${input('name','Player name')}</label>${btn('CREATE GAME','create()','full')}<hr><label>Join room ${input('room','6-character room code')}</label>${btn('JOIN GAME','join()','full secondary')}</div>`;if(codeFromLink)el('room').value=codeFromLink}
window.create=()=>{const name=el('name').value.trim();if(!name)return alert('Enter your name.');localStorage.setItem('abg-name',name);socket.emit('create',{name})};window.join=()=>{const name=el('name')?.value.trim()||localStorage.getItem('abg-name')||'';const code=el('room').value.trim().toUpperCase();if(!name)return alert('Enter your name.');localStorage.setItem('abg-name',name);socket.emit('join',{code,name,token:remember(code)?.token})};
socket.on('connect',()=>{el('connection').textContent='🟢 Connected';const code=identity?.code||codeFromLink;const saved=code&&remember(code);if(saved)socket.emit('join',{code,name:localStorage.getItem('abg-name')||'Player',token:saved.token});else if(!identity)entry()});socket.on('disconnect',()=>el('connection').textContent='🔴 Reconnecting…');socket.on('identity',d=>{identity=d;save();history.replaceState(null,'',`?room=${d.code}`)});socket.on('gameError',m=>alert(m));socket.on('state',s=>{state=s;render()});
function emit(event,data={}){socket.emit(event,data)}function render(){if(!state)return;const s=state,me=s.players[s.seat],other=s.players[1-s.seat];let html=`<div class="panel"><div class="row"><div><span class="caps">ROOM CODE</span><h2>${s.code}</h2></div><div>${btn('COPY INVITE','copyInvite()','secondary')}</div></div><div class="row">${s.players.map((p,i)=>`<div class="score"><b>${escapeHTML(p?.name||'Waiting…')}</b><div>${p?.score||0} pts · ${p?.skips||0} skips</div><span class="small">${p?.connected?'🟢 Online':'⚪ Offline'}</span></div>`).join('')}</div></div>`;
if(s.phase==='lobby'){html+=`<div class="panel"><h2>Choose your category</h2><p class="muted">Each player picks one; a coin flip decides which category wins.</p><label>Category <select id="category"><option value="">Select…</option>${['Animals','Foods','Movies','Sports','Things in Nature','Things at School','Places','Music','Custom'].map(c=>`<option>${c}</option>`).join('')}</select></label><label>Or type your own ${input('custom','Custom category')}</label>${btn('SAVE MY CATEGORY','saveCategory()','full')}<p>Yours: <b>${escapeHTML(me?.category||'Not selected')}</b><br>Other player: <b>${escapeHTML(other?.category||'Not selected')}</b></p>${btn('FLIP COIN & START','emit("start")','full') }</div>`}
if(s.phase==='playing'){const myTurn=s.turn===s.seat,letter=ABC[s.letter];html+=`<div class="hero"><span class="caps">CATEGORY: ${escapeHTML(s.category)}</span><h2>${letter} · ${escapeHTML(s.players[s.turn].name)}'s turn</h2><div>${escapeHTML(s.notice)}</div></div>`;if(s.pending){if(s.pending.seat!==s.seat){if(s.pending.type==='judge')html+=`<div class="panel"><h2>Accept this answer?</h2><p>${escapeHTML(s.pending.answer)}</p><div class="row">${btn('ACCEPT','emit("judge",{accept:true})')}${btn('CHALLENGE','emit("judge",{accept:false})','secondary')}</div></div>`;else html+=`<div class="panel"><h2>Prove it!</h2><p>Give an unused ${letter} answer to win a point.</p>${input('proof',letter+' answer')}<div class="row">${btn('PROVE IT','prove()')}${btn("CAN'T DO IT",'emit("prove",{can:false})','secondary')}</div></div>`}else html+='<div class="panel">Waiting for your opponent to respond…</div>';}else if(myTurn){html+=`<div class="panel"><h2>${s.letter===0?'Start the list':'Recall the list, then add '+letter}</h2>${s.letter?`<p class="muted">Speak naturally, e.g. “Apple, Brown Bear, Cat.” No “next” required.</p>`:'<p class="muted">There is nothing to recall for A.</p>'}<div id="fields">${fields(s.letter)}</div><div class="row">${btn('🎤 SPEAK ANSWERS','startVoice()','mic')}${btn('STOP MIC','stopVoice()','secondary')}</div><div id="voiceStatus" class="status"></div><p class="muted">Review the recognized words before submitting. Voice recognition depends on browser support.</p>${btn('SUBMIT TURN','submit()','full')}${s.letter?btn('ELIMINATE LETTER','emit("eliminate")','full secondary'):''}</div>`}else html+='<div class="panel">Your opponent is taking their turn. Keep this page open.</div>'}
if(s.phase==='final'){html+=`<div class="hero"><h2>FINAL MEMORY CHALLENGE</h2><p>Perfect recall earns +5 points!</p><p>${escapeHTML(s.notice)}</p></div>`;if(s.finalTurn===s.seat&&!s.finalDone[s.seat])html+=`<div class="panel"><h2>Recall A through Z</h2><div id="fields">${fields(s.listLength,true)}</div><div class="row">${btn('🎤 SPEAK ANSWERS','startVoice()','mic')}${btn('STOP MIC','stopVoice()','secondary')}</div><div id="voiceStatus" class="status"></div>${btn('SUBMIT FINAL RECALL','submitFinal()','full')}</div>`;else html+='<div class="panel">Waiting for the other player…</div>'}
if(s.phase==='finished')html+=`<div class="hero"><h2>🏆 ${escapeHTML(s.champion)}</h2><p>${escapeHTML(s.notice)}</p>${btn('PLAY NEW GAME','newGame()')}</div>`;html+=`<div id="history" class="panel"><b>Game updates</b><p>${s.history.map(escapeHTML).join('<br>')||'Ready to play!'}</p></div>`;app.innerHTML=html;if(s.phase==='playing'&&s.turn===s.seat&&!s.pending||s.phase==='final'&&s.finalTurn===s.seat&&!s.finalDone[s.seat]){const key=s.phase+'-'+s.letter+'-'+s.turn;if(key!==lastTurn){lastTurn=key;setTimeout(()=>el('f0')?.focus(),80)}}}
function fields(count,final=false){let out='';for(let i=0;i<count;i++)out+=`<label class="field"><b>${ABC[i]}</b>${input('f'+i,'Recall '+ABC[i])}</label>`;if(!final)out+=`<label class="field"><b>${ABC[count]}</b>${input('newAnswer','New '+ABC[count]+' answer')}</label>`;return out}
window.copyInvite=async()=>{const link=location.origin+'/?room='+state.code;try{await navigator.clipboard.writeText(link);alert('Invite link copied!')}catch{prompt('Copy invite link:',link)}};window.saveCategory=()=>{const c=el('custom').value.trim()||el('category').value;if(!c||c==='Custom')return alert('Select or type a category.');emit('category',{category:c})};window.prove=()=>emit('prove',{can:true,answer:el('proof').value});window.submit=()=>emit('submit',{recall:Array.from({length:state.letter},(_,i)=>el('f'+i).value),answer:el('newAnswer').value});window.submitFinal=()=>emit('final',{recall:Array.from({length:state.listLength},(_,i)=>el('f'+i).value)});window.newGame=()=>{identity=null;history.replaceState(null,'',location.pathname);entry()};
// Alphabet-aware segmentation: boundary when a word starts with the next expected letter.
// Multiword answers remain grouped, e.g. "brown bear" for B. Ambiguities are editable.
function distribute(transcript){const final=state.phase==='final',count=final?state.listLength:state.letter+1;let words=transcript.replace(/[.,;!?]+/g,' ').split(/\s+/).filter(Boolean),groups=[],current=[],index=0;for(const word of words){const initial=word[0]?.toUpperCase();if(!current.length){current.push(word);continue}if(index<count-1&&initial===ABC[index+1]){groups.push(current.join(' '));current=[word];index++}else current.push(word)}if(current.length)groups.push(current.join(' '));for(let i=0;i<Math.min(count,groups.length);i++){const id=!final&&i===state.letter?'newAnswer':'f'+i;const field=el(id);if(field)field.value=groups[i]}}
window.stopVoice=()=>{try{voice?.stop()}catch{};voice=null;const status=el('voiceStatus');if(status)status.textContent='Microphone stopped.'};window.startVoice=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=el('voiceStatus');if(!SR){status.textContent='This browser does not support built-in speech recognition. Use the microphone on your phone keyboard, or type answers.';return}stopVoice();voice=new SR();voice.lang='en-US';voice.continuous=true;voice.interimResults=false;let text='';voice.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)text+=' '+e.results[i][0].transcript;distribute(text);status.textContent='Heard: '+text.trim()+' — check the fields before submitting.'};voice.onerror=e=>status.textContent='Microphone: '+e.error+'. You can still type your answers.';voice.onend=()=>{voice=null;if(status&&!status.textContent.startsWith('Heard:'))status.textContent='Microphone stopped.'};try{voice.start();status.textContent='Listening… Speak A, B, C in order, naturally.'}catch(e){status.textContent=e.message}};
entry();
</script></body></html>
